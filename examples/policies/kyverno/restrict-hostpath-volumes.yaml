apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-hostpath-volumes
  annotations:
    policies.kyverno.io/title: Restrictions on hostPath volumes
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Pods must not mount directories from the node file system through hostPath volumes.
    kubepolicy.dev/version: 1.0.0
    kubepolicy.dev/remediation: >-
      Replace hostPath volumes with a PersistentVolumeClaim, a ConfigMap, a Secret or an emptyDir volume.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: "object.spec.?volumes.orValue([]).all(v, !has(v.hostPath))"
      message: hostPath volumes are not allowed. Use a PersistentVolumeClaim, ConfigMap, Secret or emptyDir instead.
