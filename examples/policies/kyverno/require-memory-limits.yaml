apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-memory-limits
  annotations:
    policies.kyverno.io/title: Required memory limits
    policies.kyverno.io/category: Resources
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every container must set a memory limit. This overlaps on purpose with the Rego policy kubernetes.resource_limits to show two engines checking the same resource.
    kubepolicy.dev/version: 1.0.0
    kubepolicy.dev/remediation: >-
      Set resources.limits.memory on every container.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c, c.?resources.?limits.?memory.hasValue())
      message: Every container must set resources.limits.memory.
