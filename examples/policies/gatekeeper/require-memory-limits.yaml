# This template takes a parameter: the list of resources that must have a
# limit. The constraint below asks for memory.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredlimits
  annotations:
    metadata.gatekeeper.sh/title: Required resource limits
    description: >-
      Every container must set a limit for each of the listed resources.
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredLimits
      validation:
        openAPIV3Schema:
          type: object
          properties:
            resources:
              description: Resource names that need a limit, for example memory.
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredlimits

        violation[{"msg": msg, "details": {"container": container.name, "resource": resource}}] {
          container := all_containers[_]
          resource := input.parameters.resources[_]
          not container.resources.limits[resource]
          msg := sprintf("container %q must set resources.limits.%s", [container.name, resource])
        }

        all_containers[c] { c := input.review.object.spec.containers[_] }
        all_containers[c] { c := input.review.object.spec.initContainers[_] }
        all_containers[c] { c := input.review.object.spec.ephemeralContainers[_] }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLimits
metadata:
  name: require-memory-limits
  annotations:
    kubepolicy.cosmos.dev/title: Required memory limits
    kubepolicy.cosmos.dev/description: >-
      Every container must set a memory limit. This overlaps on purpose with the Rego policy kubernetes.resource_limits to show two engines checking the same resource.
    kubepolicy.cosmos.dev/category: Resources
    kubepolicy.cosmos.dev/severity: medium
    kubepolicy.cosmos.dev/version: 1.0.0
    kubepolicy.cosmos.dev/remediation: >-
      Set resources.limits.memory on every container.
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
  parameters:
    resources: ["memory"]
