# This policy looks up a ConfigMap that lives in the cluster. Offline, the
# ConfigMap must be supplied in context.resources; otherwise the result is
# "unknown", never "pass".
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-registered-team
  annotations:
    policies.kyverno.io/title: Team must be registered
    policies.kyverno.io/category: Ownership
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      The team label of a production workload must be a key of the ConfigMap
      registered-teams in the platform-system namespace.
    kubepolicy.dev/version: 1.0.0
    kubepolicy.dev/remediation: >-
      Set metadata.labels.team to a team listed in the registered-teams ConfigMap, or ask the platform team to register your team.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
  variables:
    - name: teams
      expression: resource.Get('v1', 'configmaps', 'platform-system', 'registered-teams')
  validations:
    - expression: >-
        object.metadata.?labels.?team.orValue('') in variables.teams.data
      message: The team label is not a registered team.
