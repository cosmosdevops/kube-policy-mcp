# This policy only applies in namespaces labelled environment=production. The
# namespace labels are context: without them the result is "unknown".
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag-in-production
  annotations:
    policies.kyverno.io/title: No mutable image tags in production
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      In production namespaces, container images must use an explicit tag other than latest.
    kubepolicy.dev/version: 1.0.0
    kubepolicy.dev/remediation: >-
      Pin every container image to an explicit version tag or digest.
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        environment: production
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c, c.image.contains(':') && !c.image.endsWith(':latest'))
      message: Container images in production must use an explicit tag other than latest.
