apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    kubepolicy.dev/title: Restricted container privileges
    kubepolicy.dev/category: Pod Security
    kubepolicy.dev/severity: high
    kubepolicy.dev/description: >-
      Containers must not run privileged and must not be able to gain more privileges than their parent process.
    kubepolicy.dev/version: 1.0.0
    kubepolicy.dev/remediation: >-
      Remove securityContext.privileged (or set it to false) and set securityContext.allowPrivilegeEscalation to false on every container.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    # A ValidatingAdmissionPolicy has no autogen. To cover pod controllers the
    # policy matches them itself and finds the pod spec inside each kind.
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec
        : object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec
        : object.spec.template.spec
    - name: allContainers
      expression: >-
        variables.podSpec.containers
        + variables.podSpec.?initContainers.orValue([])
        + variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c, !c.?securityContext.?privileged.orValue(false))
      message: Privileged containers are not allowed. Remove securityContext.privileged or set it to false.
    - expression: >-
        variables.allContainers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: Every container must set securityContext.allowPrivilegeEscalation to false.
---
# A policy does nothing until a binding puts it into effect. The binding also
# decides the action: Deny, Warn or Audit.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: disallow-privileged-containers
spec:
  policyName: disallow-privileged-containers
  validationActions: [Deny]
