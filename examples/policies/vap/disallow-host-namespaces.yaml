apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    kubepolicy.cosmos.dev/title: Prohibited host networking
    kubepolicy.cosmos.dev/category: Pod Security
    kubepolicy.cosmos.dev/severity: high
    kubepolicy.cosmos.dev/description: >-
      Pods must not share the host network, PID or IPC namespaces.
    kubepolicy.cosmos.dev/version: 1.0.0
    kubepolicy.cosmos.dev/remediation: >-
      Remove hostNetwork, hostPID and hostIPC from the pod spec, or set them to false.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    # A ValidatingAdmissionPolicy has no autogen. To cover pod controllers the
    # policy matches them itself and finds the pod spec inside each kind.
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec
        : object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec
        : object.spec.template.spec
    - name: specPath
      expression: >-
        object.kind == 'Pod' ? 'spec'
        : object.kind == 'CronJob' ? 'spec.jobTemplate.spec.template.spec'
        : 'spec.template.spec'
  validations:
    - expression: "!variables.podSpec.?hostNetwork.orValue(false)"
      message: Host networking is not allowed. Remove hostNetwork from the pod spec or set it to false.
    - expression: "!variables.podSpec.?hostPID.orValue(false)"
      message: Sharing the host PID namespace is not allowed. Remove hostPID from the pod spec or set it to false.
    - expression: "!variables.podSpec.?hostIPC.orValue(false)"
      message: Sharing the host IPC namespace is not allowed. Remove hostIPC from the pod spec or set it to false.
  # "field.<index>" tells the server which field validation <index> is about,
  # so that explain_violation can show the value it found.
  auditAnnotations:
    - key: field.0
      valueExpression: variables.specPath + '.hostNetwork'
    - key: field.1
      valueExpression: variables.specPath + '.hostPID'
    - key: field.2
      valueExpression: variables.specPath + '.hostIPC'
---
# A policy does nothing until a binding puts it into effect. The binding also
# decides the action: Deny, Warn or Audit.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: disallow-host-namespaces
spec:
  policyName: disallow-host-namespaces
  validationActions: [Deny]
