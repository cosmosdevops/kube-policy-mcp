# Used with the "production" pack. Its result depends on context: the labels
# of the checkout namespace and the registered-teams ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: checkout
  labels:
    owner: sam.lee
    team: checkout
    app.kubernetes.io/name: checkout
    app.kubernetes.io/version: "3.1.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: checkout
          image: registry.example.com/checkout/checkout:3.1.0
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
