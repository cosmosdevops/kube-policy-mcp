# Run kube-policy-mcp as a hosted MCP server.
#
#   docker compose -f deploy/compose.yaml up -d
#
# It listens on localhost only. Apache passes /mcp on to it; see
# kube-policy-mcp-apache.conf.
services:
  kube-policy-mcp:
    # Built from a checkout of this repo. There is no published image yet.
    build: ..
    image: kube-policy-mcp:local
    command:
      - serve
      - --http=0.0.0.0:8088
      - --keys=/config/keys
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      # The directory holding the config file, the policies and the keys
      # file:
      #
      #   /etc/kube-policy-mcp/kube-policy-mcp.yaml
      #   /etc/kube-policy-mcp/policies/...
      #   /etc/kube-policy-mcp/keys
      #
      # Mount the directory, not the files: editors replace a file when
      # saving, and a mounted file would keep pointing at the old one.
      - /etc/kube-policy-mcp:/config:ro
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "/kube-policy-mcp", "check-health", "http://127.0.0.1:8088/healthz"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 5s
