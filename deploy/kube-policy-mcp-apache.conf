# Send /mcp to the kube-policy-mcp service. Include this inside the site's
# HTTPS <VirtualHost>, e.g.
#
#   Include /etc/apache2/kube-policy-mcp-apache.conf
#
# Needs: a2enmod proxy proxy_http
#
# Leave ProxyPreserveHost off (the default). kube-policy-mcp refuses
# requests that arrive on localhost with another site's Host header.
ProxyPass        /mcp http://127.0.0.1:8088/mcp timeout=90
ProxyPassReverse /mcp http://127.0.0.1:8088/mcp

# A call carries at most 5MB of manifests (limits.maxManifestBytes),
# JSON-encoded.
<Location /mcp>
    LimitRequestBody 10600000
</Location>
